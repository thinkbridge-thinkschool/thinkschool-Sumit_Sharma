<nav class="app-tabs">
  <div class="app-tabs-inner">
    <button
      type="button"
      class="app-tab"
      [class.active]="activeTab() === 'browse'"
      (click)="setTab('browse')"
    >
      Browse
    </button>
    <button
      type="button"
      class="app-tab"
      [class.active]="activeTab() === 'explorer'"
      (click)="setTab('explorer')"
    >
      Explorer
    </button>
    <button
      type="button"
      class="app-tab"
      [class.active]="activeTab() === 'create'"
      (click)="setTab('create')"
    >
      Create
    </button>
    <button
      type="button"
      class="app-tab"
      [class.active]="activeTab() === 'create-signal'"
      (click)="setTab('create-signal')"
    >
      Create (Signal Forms)
    </button>
  </div>
</nav>

@if (activeTab() === 'browse') {
  <app-quotes></app-quotes>
} @else if (activeTab() === 'explorer') {
  <main class="explorer-page">
    <app-quotes-list></app-quotes-list>
  </main>
} @else if (activeTab() === 'create') {
  <main class="explorer-page">
    <app-create-quote></app-create-quote>
  </main>
} @else {
  <main class="explorer-page">
    <app-create-quote-signal></app-create-quote-signal>
  </main>
}
