name: day19-servicebus-emulator

services:
  sqledge:
    container_name: day19-sqledge
    image: mcr.microsoft.com/azure-sql-edge:latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${SQL_PASSWORD:-DayNineteen!Passw0rd}"
    networks:
      sb-emulator:
        aliases:
          - sqledge

  emulator:
    container_name: day19-servicebus-emulator
    image: mcr.microsoft.com/azure-messaging/servicebus-emulator:latest
    pull_policy: missing
    volumes:
      - "./servicebus-emulator/Config/Config.json:/ServiceBus_Emulator/ConfigFiles/Config.json"
    ports:
      - "5672:5672"
      - "5300:5300"
    environment:
      SQL_SERVER: sqledge
      MSSQL_SA_PASSWORD: "${SQL_PASSWORD:-DayNineteen!Passw0rd}"
      ACCEPT_EULA: "Y"
      SQL_WAIT_INTERVAL: "15"
      EMULATOR_HTTP_PORT: "5300"
    depends_on:
      - sqledge
    networks:
      sb-emulator:
        aliases:
          - sb-emulator

networks:
  sb-emulator:
