name: CI

on:
  push:
  pull_request:
    branches: [main]

env:
  COVERAGE_THRESHOLD: 70

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    env:
      Jwt__Key: ${{ secrets.JWT_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore QuotesApi.Tests
        run: dotnet restore QuotesApi.Tests/QuotesApi.Tests.csproj

      - name: Restore Quotes.Tests.Unit
        run: dotnet restore Quotes.Tests.Unit/Quotes.Tests.Unit.csproj

      - name: Restore Quotes.Tests.Integration
        run: dotnet restore Quotes.Tests.Integration/Quotes.Tests.Integration.csproj

      - name: Restore Tests.Domain
        run: dotnet restore Tests.Domain/Tests.Domain.csproj

      - name: Build QuotesApi.Tests
        run: dotnet build QuotesApi.Tests/QuotesApi.Tests.csproj --no-restore --configuration Release

      - name: Build Quotes.Tests.Unit
        run: dotnet build Quotes.Tests.Unit/Quotes.Tests.Unit.csproj --no-restore --configuration Release

      - name: Build Quotes.Tests.Integration
        run: dotnet build Quotes.Tests.Integration/Quotes.Tests.Integration.csproj --no-restore --configuration Release

      - name: Build Tests.Domain
        run: dotnet build Tests.Domain/Tests.Domain.csproj --no-restore --configuration Release

      - name: Pull SQL Server image for Testcontainers
        run: docker pull mcr.microsoft.com/mssql/server:2022-latest

      - name: Test QuotesApi.Tests
        run: >
          dotnet test QuotesApi.Tests/QuotesApi.Tests.csproj --no-build --configuration Release
          --logger "trx;LogFileName=QuotesApi.Tests.trx"
          --results-directory ./TestResults/QuotesApi.Tests
          --collect:"XPlat Code Coverage"

      - name: Test Quotes.Tests.Unit
        run: >
          dotnet test Quotes.Tests.Unit/Quotes.Tests.Unit.csproj --no-build --configuration Release
          --logger "trx;LogFileName=Quotes.Tests.Unit.trx"
          --results-directory ./TestResults/Quotes.Tests.Unit
          --collect:"XPlat Code Coverage"

      - name: Test Quotes.Tests.Integration
        run: >
          dotnet test Quotes.Tests.Integration/Quotes.Tests.Integration.csproj --no-build --configuration Release
          --logger "trx;LogFileName=Quotes.Tests.Integration.trx"
          --results-directory ./TestResults/Quotes.Tests.Integration
          --collect:"XPlat Code Coverage"

      - name: Test Tests.Domain
        run: >
          dotnet test Tests.Domain/Tests.Domain.csproj --no-build --configuration Release
          --logger "trx;LogFileName=Tests.Domain.trx"
          --results-directory ./TestResults/Tests.Domain
          --collect:"XPlat Code Coverage"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/**/*.trx
          retention-days: 30

      - name: Upload raw coverage files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-raw
          path: TestResults/**/coverage.cobertura.xml
          retention-days: 30

      - name: Install ReportGenerator
        if: always()
        run: |
          dotnet tool install --global dotnet-reportgenerator-globaltool
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      # QuotesApi.Migrations.* is EF Core scaffolded code; excluded from the
      # coverage gate since testing generated migration code adds no signal.
      - name: Merge coverage reports
        if: always()
        run: >
          reportgenerator
          -reports:"TestResults/**/coverage.cobertura.xml"
          -targetdir:"CoverageReport"
          -reporttypes:"Cobertura;TextSummary;Html"
          -classfilters:"-QuotesApi.Migrations.*"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: CoverageReport
          retention-days: 30

      - name: Enforce minimum code coverage
        run: |
          COVERAGE=$(grep "Line coverage:" CoverageReport/Summary.txt | grep -oE '[0-9]+(\.[0-9]+)?' | head -1)
          echo "Total line coverage: ${COVERAGE}%"
          echo "Required minimum: ${COVERAGE_THRESHOLD}%"
          awk -v cov="$COVERAGE" -v min="$COVERAGE_THRESHOLD" 'BEGIN {
            if (cov + 0 < min + 0) {
              print "Code coverage " cov "% is below the required " min "% threshold."
              exit 1
            }
            print "Code coverage " cov "% meets the required " min "% threshold."
          }'
